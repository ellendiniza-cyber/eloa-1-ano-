<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f2e8">
<title>Moldura da Eloá — 1 ano</title>
<style>
:root{--green:#496b3e;--red:#b51f32;--cream:#fffaf0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f8f1df,#fffaf4);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#433b2d}
main{max-width:560px;margin:auto;padding:22px 16px 36px;text-align:center}
h1{color:var(--red);font-size:clamp(1.7rem,7vw,2.4rem);margin:8px 0 4px}
p{line-height:1.45;margin:8px auto 16px;max-width:420px}
.stage{position:relative;width:min(100%,360px);aspect-ratio:928/1664;margin:18px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px #60451c22}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;touch-action:none}
#frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.placeholder{position:absolute;inset:27% 12% 28%;display:grid;place-items:center;padding:14px;color:#786b55;font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
button,.filelabel{border:0;border-radius:999px;padding:13px 18px;font-weight:700;font-size:1rem;cursor:pointer}
.primary{background:var(--green);color:white}.secondary{background:#f0e5cd;color:#4d442f}
input[type=file]{display:none}.hint{font-size:.86rem;color:#786b55}
canvas{display:none}
</style>
</head>
<body><main>
<h1>O Bosque da Eloá 🌿</h1>
<p>Uma lembrança especial do primeiro aninho! Escolha uma foto e monte sua imagem com a moldura da Eloá.</p>
<div class="stage" id="stage">
  <img id="photo" alt="Sua foto">
  <img id="frame" src="moldura-eloa.png" alt="Moldura Bosque Encantado da Eloá">
  <div class="placeholder" id="placeholder">Sua foto aparecerá aqui 💚</div>
</div>
<div class="controls">
<label class="filelabel primary" for="upload">🖼️ Escolher foto</label>
<input id="upload" type="file" accept="image/*">
<button class="secondary" id="save">⬇️ Salvar imagem</button>
</div>
<p class="hint">Dica: escolha uma foto vertical para encaixar melhor na moldura. A imagem é montada no seu aparelho.</p>
<canvas id="canvas"></canvas>
</main>
<script>
const upload=document.getElementById('upload'), photo=document.getElementById('photo'), frame=document.getElementById('frame'),
placeholder=document.getElementById('placeholder'), canvas=document.getElementById('canvas');
let photoLoaded=false;
upload.addEventListener('change',()=>{
 const f=upload.files&&upload.files[0]; if(!f)return;
 const url=URL.createObjectURL(f);
 photo.onload=()=>{photoLoaded=true;photo.style.display='block';placeholder.style.display='none';};
 photo.src=url;
});
document.getElementById('save').addEventListener('click',()=>{
 if(!photoLoaded){alert('Primeiro escolha uma foto!');return;}
 const ctx=canvas.getContext('2d');
 canvas.width=frame.naturalWidth;canvas.height=frame.naturalHeight;
 // Cover-crop photo into the full canvas, then overlay the decorative frame.
 const iw=photo.naturalWidth,ih=photo.naturalHeight,cw=canvas.width,ch=canvas.height;
 const scale=Math.max(cw/iw,ch/ih),sw=cw/scale,sh=ch/scale,sx=(iw-sw)/2,sy=(ih-sh)/2;
 ctx.drawImage(photo,sx,sy,sw,sh,0,0,cw,ch);
 ctx.drawImage(frame,0,0,cw,ch);
 canvas.toBlob(blob=>{
   if(!blob){alert('Não foi possível criar a imagem. Tente outra foto.');return;}
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eloa-1-ano.png';a.click();
   setTimeout(()=>URL.revokeObjectURL(a.href),1500);
 },'image/png');
});
</script>
</body></html>
