<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosque da Eloá — 1 ano</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf4e7;color:#443b2c;font-family:system-ui,sans-serif}main{max-width:560px;margin:auto;padding:20px 14px 36px;text-align:center}h1{color:#b51f32;margin:8px}p{line-height:1.45}.stage{position:relative;width:min(100%,360px);aspect-ratio:928/1664;margin:16px auto;background:white;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px #60451c22}#live,#photo,#frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}#live,#photo{display:none;object-fit:cover}#frame{pointer-events:none}.placeholder{position:absolute;inset:25% 12%;display:grid;place-items:center;color:#786b55}button{border:0;border-radius:999px;padding:12px 14px;margin:4px;background:#496b3e;color:white;font-weight:700;font-size:15px}.secondary{background:#f0e5cd;color:#4d442f}button:disabled{opacity:.45}#status{min-height:1.3em;color:#496b3e;font-size:14px}canvas{display:none}</style></head>
<body><main><h1>O Bosque da Eloá 🌿</h1><p>Tire uma foto ou grave um vídeo com a moldura do primeiro aninho da Eloá!</p>
<div class="stage"><video id="live" autoplay playsinline muted></video><img id="photo" alt="Foto"><img id="frame" src="moldura-eloa.png" alt="Moldura da Eloá"><div id="placeholder" class="placeholder">Sua foto ou vídeo aparecerá aqui 💚</div></div>
<div><button id="open">📷 Abrir câmera</button><button id="snap" disabled>📸 Tirar foto</button><button id="rec" disabled>🔴 Gravar vídeo</button><button id="flip" class="secondary" disabled>🔄 Trocar câmera</button></div>
<div><button id="save" class="secondary" disabled>⬇️ Salvar foto</button><button id="close" class="secondary" disabled>Fechar câmera</button></div>
<div><label for="upload"><button class="secondary" type="button">🖼️ Escolher foto</button></label><input id="upload" type="file" accept="image/*" hidden></div>
<p id="status">Permita o acesso à câmera quando o navegador solicitar.</p><p style="font-size:13px;color:#786b55">A câmera funciona em páginas HTTPS. A gravação de vídeo com moldura depende do suporte do navegador.</p><canvas id="canvas"></canvas></main>
<script>
const $=id=>document.getElementById(id), live=$('live'), photo=$('photo'), frame=$('frame'), canvas=$('canvas');
let stream=null,facing='environment',recorder=null,chunks=[],recording=false,raf=0,photoReady=false;
function say(s){$('status').textContent=s}
function photoShow(src){photo.onload=()=>{photo.style.display='block';live.style.display='none';$('placeholder').style.display='none';$('save').disabled=false;photoReady=true};photo.src=src}
async function start(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error();if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});live.srcObject=stream;await live.play();live.style.display='block';photo.style.display='none';$('placeholder').style.display='none';['snap','rec','flip','close'].forEach(x=>$(x).disabled=false);$('save').disabled=true;say('Câmera pronta! Tire uma foto ou grave um vídeo.')}catch(e){say('Não consegui abrir a câmera. Abra o link no Safari/Chrome e permita câmera e microfone.');}}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;live.srcObject=null;live.style.display='none';['snap','rec','flip','close'].forEach(x=>$(x).disabled=true);if(raf)cancelAnimationFrame(raf);say('Câmera fechada.')}
function drawFrame(){let w=canvas.width=frame.naturalWidth||928,h=canvas.height=frame.naturalHeight||1664,ctx=canvas.getContext('2d'),iw=live.videoWidth,ih=live.videoHeight;if(iw&&ih){let s=Math.max(w/iw,h/ih),sw=w/s,sh=h/s;ctx.save();if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(live,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,w,h);ctx.restore();ctx.drawImage(frame,0,0,w,h)}}
$('open').onclick=start;$('close').onclick=stop;$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};
$('snap').onclick=()=>{if(!stream)return;drawFrame();photoShow(canvas.toDataURL('image/png'));say('Foto pronta! Toque em Salvar foto.')};
$('upload').onchange=e=>{let f=e.target.files[0];if(f){photoShow(URL.createObjectURL(f));say('Foto escolhida. Toque em Salvar foto.')}};
$('save').onclick=()=>{if(!photoReady)return;let w=canvas.width=frame.naturalWidth||928,h=canvas.height=frame.naturalHeight||1664,ctx=canvas.getContext('2d'),iw=photo.naturalWidth,ih=photo.naturalHeight,s=Math.max(w/iw,h/ih),sw=w/s,sh=h/s;ctx.drawImage(photo,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,w,h);ctx.drawImage(frame,0,0,w,h);canvas.toBlob(b=>{let a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='eloa-1-ano.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);say('Foto salva!')},'image/png')};
$('rec').onclick=()=>{if(!stream||recording)return;if(!window.MediaRecorder||!canvas.captureStream){say('Seu navegador não suporta vídeo com moldura. Você ainda pode tirar fotos.');return}
chunks=[];let out=canvas.captureStream(24);stream.getAudioTracks().forEach(t=>out.addTrack(t));let mime=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':'video/webm';try{recorder=new MediaRecorder(out,MediaRecorder.isTypeSupported(mime)?{mimeType:mime}:{})}catch(e){say('Gravação não suportada neste navegador.');return}
recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let type=recorder.mimeType||mime,b=new Blob(chunks,{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=type.includes('mp4')?'eloa-video.mp4':'eloa-video.webm';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);recording=false;$('rec').textContent='🔴 Gravar vídeo';$('rec').style.background='#496b3e';cancelAnimationFrame(raf);out.getTracks().forEach(t=>t.stop());say('Vídeo baixado! Confira em Arquivos/Downloads.')};
recording=true;const loop=()=>{if(!recording)return;drawFrame();raf=requestAnimationFrame(loop)};loop();recorder.start();$('rec').textContent='⏹️ Parar e salvar';$('rec').style.background='#b51f32';say('Gravando! Toque em Parar e salvar quando terminar.')};
</script></body></html>
